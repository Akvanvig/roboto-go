{{- if .Values.ytCipher.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-yt-cipher" ( include "roboto-go.name" .) }}
  labels:
    {{- include "roboto-go.labelsYtCipher" . | nindent 4 }}
spec:
  type: {{ .Values.ytCipher.service.type }}
  ports:
    - port: {{ .Values.ytCipher.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "roboto-go.selectorLabelsYtCipher" . | nindent 4 }}
{{- end }}
